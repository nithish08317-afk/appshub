<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
  <title>SRICHAKRA APP HUB</title>
  <!-- Google Font: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f4f9f7;
      --surface: #ffffff;
      --ink: #1e3d38;
      --primary: #0f6b5f;
      --primary-light: #d2f0ea;
      --border: #c5ded7;
      --accent: #c9a959;
      --radius-card: 24px;
      --radius-pill: 40px;
      --shadow-sm: 0 4px 12px rgba(0, 50, 40, 0.04);
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 12px;
      --space-lg: 16px;
      --fs-micro: 0.65rem;
      --fs-small: 0.72rem;
      --fs-body: 0.8rem;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      height: 100vh;
      overflow: hidden;
      padding: var(--space-sm);
    }

    .dashboard {
      max-width: 1440px;
      height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
      overflow: hidden;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius-card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      padding: var(--space-sm) var(--space-md);
    }

    .btn {
      background: white;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-pill);
      padding: var(--space-xs) var(--space-sm);
      font-size: var(--fs-small);
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn i { font-size: 0.7rem; }
    .btn:hover { background: var(--primary-light); border-color: var(--primary); }
    .btn-small { padding: 2px 8px; font-size: var(--fs-micro); }

    /* header & announcement */
    .header-row {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--surface); border-radius: 60px; padding: var(--space-xs) var(--space-lg) var(--space-xs) var(--space-sm);
    }
    .logo img { height: 34px; }
    .hydration-gauge-wrapper {
      display: flex; align-items: center; gap: var(--space-xs);
      background: #e9f3f0; border-radius: 60px; padding: var(--space-xs) var(--space-md);
    }
    .gauge-label { font-size: var(--fs-micro); font-weight: 700; color: var(--primary); text-transform: uppercase; }
    .liquid-gauge { position: relative; width: 40px; height: 40px; }
    #hydrationGauge { width: 40px; height: 40px; }
    .timer-overlay {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 0.55rem; color: #0a4c42; background: rgba(255,255,255,0.3); border-radius: 50%;
    }

    .announce-area {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface); border-radius: 60px; padding: var(--space-xs) var(--space-lg);
    }
    .scroller { flex: 1; white-space: nowrap; overflow: hidden; margin-right: var(--space-sm); }
    .scroll-text { display: inline-block; animation: scrollNews 20s linear infinite; font-size: var(--fs-small); }
    @keyframes scrollNews { 0% { transform: translateX(100%); } 100% { transform: translateX(-120%); } }
    .news-admin input { background: white; border: 1.5px solid var(--border); border-radius: 40px; padding: 4px 8px; font-size: var(--fs-micro); width: 130px; }

    /* stats row (4 compact cards) */
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: var(--space-xs);
    }
    .stat-card {
      background: var(--surface); border-radius: 20px; border: 1px solid var(--border);
      padding: var(--space-xs) var(--space-sm);
    }
    .stat-title {
      font-size: 0.6rem; font-weight: 700; text-transform: uppercase; color: #50776f;
      margin-bottom: 2px; display: flex; align-items: center; gap: 4px;
    }
    /* sentiment tiny */
    .sentiment-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 2px; }
    .sentiment-btn { font-size: 1rem; background: none; border: none; cursor: pointer; }
    .sentiment-percent { font-size: 0.5rem; font-weight: 700; color: var(--primary); display: block; }
    .sentiment-bar { width: 80%; height: 3px; margin: 2px auto; background: #e0ede9; overflow: hidden; }
    .sentiment-bar span { display: block; height: 100%; background: var(--primary); }
    /* trending tiny */
    .trending-tags { display: flex; flex-wrap: wrap; gap: 2px; max-height: 46px; overflow-y: auto; }
    .tag-ultra { background: #edf6f3; border-radius: 999px; padding: 2px 6px; font-size: 0.55rem; font-weight: 600; color: var(--primary); display: inline-flex; align-items: center; gap: 2px; }
    .delete-tiny { background: none; border: none; color: #8eb3ab; cursor: pointer; font-size: 0.55rem; }
    .tag-input-small { width: 60px; font-size: 0.5rem; padding: 2px 4px; border: 1.5px solid var(--border); border-radius: 999px; }
    /* safety & poll */
    .safety-streak-number { font-size: 1.4rem; font-weight: 800; color: var(--primary); line-height: 1; }
    .safety-unit { font-size: 0.7rem; color: #50776f; }
    .poll-options { display: flex; gap: 4px; margin-top: 2px; flex-wrap: wrap; }
    .poll-vote-btn { background: #edf6f3; border: none; border-radius: 999px; padding: 2px 6px; font-size: 0.55rem; font-weight: 600; color: var(--primary); cursor: pointer; }
    .poll-percent { font-size: 0.5rem; color: #50776f; }

    /* ---------- QUICK LINKS – vertical sections, each with horizontal scroll ---------- */
    .quicklinks-section {
      flex: 1 1 auto;
      min-height: 0;
      background: var(--surface);
      border-radius: var(--radius-card);
      border: 1px solid var(--border);
      padding: var(--space-md);
      display: flex;
      flex-direction: column;
    }
    .quicklinks-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-sm);
    }
    .quicklinks-header h2 {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    /* container for sections – vertical scroll if many */
    .sections-vertical {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
      padding-right: 4px;
      flex: 1;
    }
    /* each section card */
    .section-card {
      background: #fafdfc;
      border-radius: 20px;
      border: 1px solid var(--border);
      padding: var(--space-sm) var(--space-sm);
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-xs);
    }
    .section-title {
      font-weight: 700;
      font-size: 0.75rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .delete-section-btn, .delete-link-btn {
      background: none; border: none; color: #a0c0b8; cursor: pointer;
      font-size: 0.65rem; padding: 2px 4px; border-radius: 12px;
    }
    .delete-section-btn:hover, .delete-link-btn:hover { background: #ffe6e6; color: #b34040; }

    /* HORIZONTAL SCROLL for links */
    .links-horizontal {
      display: flex;
      overflow-x: auto;
      gap: var(--space-xs);
      padding-bottom: 2px; /* space for scrollbar */
      scrollbar-width: thin;
      align-items: center;
    }
    .links-horizontal::-webkit-scrollbar { height: 4px; background: #e0ede9; border-radius: 4px; }
    .links-horizontal::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }

    /* link item as a card with emoji + name */
    .link-item-h {
      display: inline-flex;
      align-items: center;
      background: white;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px 4px 8px;
      gap: 6px;
      flex-shrink: 0;
      font-size: 0.7rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      transition: background 0.1s;
    }
    .link-item-h:hover { background: var(--primary-light); border-color: var(--primary); }
    .link-item-h a {
      text-decoration: none;
      color: var(--primary);
      font-weight: 600;
      white-space: nowrap;
    }
    .link-item-h a:hover { text-decoration: underline; }
    .link-emoji {
      font-size: 1rem;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.1));
    }
    .add-link-horiz-btn {
      background: none;
      border: 1px dashed var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.65rem;
      color: var(--primary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .add-link-horiz-btn:hover { background: var(--primary-light); border-style: solid; }

    /* modal & helpers */
    .modal { position: fixed; inset: 0; background: rgba(30,50,45,0.5); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 10000; }
    .modal.hidden { display: none; }
    .modal-content { background: white; border-radius: 36px; padding: 24px; max-width: 360px; width: 90%; }
    .keypad-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin: 16px 0; }
    .key-btn { background: #f1faf8; border: 1px solid #c0dbd4; border-radius: 18px; padding: 10px 0; font-size: 1rem; font-weight: 600; color: #1f6e62; }
    .toast-premium { position: fixed; bottom: 20px; right: 20px; background: #0f6b5f; color: white; border-radius: 999px; padding: 8px 16px; font-size: 0.7rem; display: flex; align-items: center; gap: 8px; z-index: 1000; }
    .toast-hidden { display: none !important; }
    #loading { position: fixed; inset: 0; background: #f4f9f7; display: flex; justify-content: center; align-items: center; z-index: 99999; }
    .loader { width: 36px; height: 36px; border: 3px solid #d0e8e2; border-top: 3px solid #0f6b5f; border-radius: 50%; animation: spin 1s infinite; }
    @keyframes spin { 0% { transform: rotate(0); } 100% { transform: rotate(360deg); } }
    .hidden { display: none !important; }

    /* ===== additions: A–Z vertical list, hidden admin, premium detailing ===== */
    body:not(.admin) .admin-only { display: none !important; }
    .logo { cursor: pointer; user-select: none; -webkit-user-select: none; transition: transform .25s ease; }
    .logo:hover { transform: scale(1.03); }
    .header-row { box-shadow: 0 1px 0 rgba(201,169,89,.35), var(--shadow-sm); }
    .admin-bar { display: flex; align-items: center; gap: var(--space-xs); }
    .admin-pill { background: linear-gradient(135deg,#c9a959,#e3cc8a); color: #4a3a0c; font-size: var(--fs-micro); font-weight: 800; letter-spacing: 1.2px; padding: 3px 10px; border-radius: 999px; }
    .btn-gold { background: linear-gradient(135deg,var(--primary),#14897a); color: #fff; border-color: transparent; }
    .btn-gold:hover { background: linear-gradient(135deg,#0c5a50,var(--primary)); color: #fff; }
    .stat-card { transition: transform .2s ease, box-shadow .2s ease; }
    .stat-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
    .quicklinks-section { box-shadow: var(--shadow-sm); }

    .alpha-strip { display: flex; gap: 4px; overflow-x: auto; padding: 2px 2px 8px; margin-bottom: 2px; scrollbar-width: thin; }
    .alpha-strip::-webkit-scrollbar { height: 4px; background: #e0ede9; border-radius: 4px; }
    .alpha-strip::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }
    .alpha-btn { flex-shrink: 0; min-width: 30px; height: 30px; padding: 0 8px; border-radius: 999px; border: 1.5px solid var(--border); background: #fff; color: var(--primary); font: 700 var(--fs-small) 'Inter', sans-serif; cursor: pointer; transition: all .18s ease; }
    .alpha-btn:hover:not(:disabled) { background: var(--primary-light); border-color: var(--primary); transform: translateY(-1px); }
    .alpha-btn.on { background: linear-gradient(135deg,var(--primary),#14897a); color: #fff; border-color: transparent; box-shadow: 0 4px 10px rgba(15,107,95,.25); }
    .alpha-btn:disabled { opacity: .3; cursor: default; }
    .sections-admin { flex-wrap: wrap; gap: 4px; margin-bottom: var(--space-sm); align-items: center; }
    .sec-chip { background: #edf6f3; border-radius: 999px; padding: 2px 8px; font-size: var(--fs-micro); font-weight: 600; color: var(--primary); display: inline-flex; align-items: center; gap: 4px; }

    .letter-head { display: flex; align-items: center; gap: 10px; margin: var(--space-sm) 0 6px; color: var(--accent); font-weight: 800; font-size: .8rem; letter-spacing: 3px; }
    .letter-head::after { content: ""; height: 1px; flex: 1; background: linear-gradient(90deg, var(--border), transparent); }
    .link-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; margin-bottom: 6px; background: #fff; border: 1px solid var(--border); border-radius: 18px; text-decoration: none; color: inherit; position: relative; overflow: hidden; opacity: 0; transform: translateY(8px); animation: rowRise .4s ease forwards; transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease, background .2s ease; }
    .link-row::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: linear-gradient(var(--accent), var(--primary)); opacity: 0; transition: opacity .2s; }
    .link-row:hover { transform: translateX(5px); border-color: var(--primary); background: #f6fbf9; box-shadow: 0 6px 16px rgba(15,107,95,.08); }
    .link-row:hover::before { opacity: 1; }
    .link-row:hover .row-go { color: var(--accent); transform: translateX(3px); }
    @keyframes rowRise { to { opacity: 1; transform: none; } }
    .link-row .link-emoji { font-size: 1.25rem; width: 36px; height: 36px; display: grid; place-items: center; background: var(--primary-light); border-radius: 12px; flex-shrink: 0; }
    .row-main { flex: 1; min-width: 0; }
    .row-name { font-weight: 700; font-size: .82rem; color: var(--primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-sec { font-size: var(--fs-micro); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #8a7436; }
    .row-go { color: #a0c0b8; font-size: .75rem; transition: all .2s ease; }
    .row-acts { display: none; gap: 2px; }
    body.admin .row-acts { display: flex; }

    /* ===== v3: heading, app logos, directory layout ===== */
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand h1 { font-size: .95rem; font-weight: 800; letter-spacing: 3px; color: var(--primary); white-space: nowrap; }
    .brand h1 span { color: var(--accent); }
    .admin-status { font-size: var(--fs-micro); font-weight: 600; color: #50776f; }
    .link-search { background: white; border: 1.5px solid var(--border); border-radius: 40px; padding: 5px 12px; font: 500 var(--fs-small) 'Inter', sans-serif; width: 170px; outline: none; color: var(--ink); transition: border-color .2s, box-shadow .2s; }
    .link-search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(201,169,89,.18); }
    .dir-group { display: grid; grid-template-columns: 62px 1fr; gap: 8px; margin-bottom: 12px; }
    .dir-side { position: sticky; top: 0; align-self: start; padding-top: 2px; }
    .dir-letter { font-size: 2.7rem; font-weight: 800; line-height: 1; background: linear-gradient(160deg, var(--accent), var(--primary)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .dir-count { font-size: .55rem; font-weight: 700; letter-spacing: 1.5px; color: #50776f; text-transform: uppercase; }
    .app-logo { width: 42px; height: 42px; border-radius: 13px; background: #fff; border: 1px solid var(--border); display: grid; place-items: center; overflow: hidden; flex-shrink: 0; box-shadow: 0 3px 8px rgba(0,50,40,.07); font-weight: 800; font-size: 1.05rem; color: #fff; transition: transform .2s ease; }
    .app-logo img { width: 28px; height: 28px; object-fit: contain; }
    .app-logo.tile { border: none; }
    .link-row:hover .app-logo { transform: scale(1.08) rotate(-3deg); }
    .row-host { font-size: var(--fs-micro); color: #6b8f87; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
    @media (max-width: 640px) { .brand h1 { font-size: .68rem; letter-spacing: 1.5px; } .link-search { width: 110px; } .dir-group { grid-template-columns: 44px 1fr; } .dir-letter { font-size: 2rem; } }

    /* ===== v4: department cards ===== */
    .alpha-btn .cnt { font-size: .6rem; opacity: .65; margin-left: 5px; }
    .dept-card { margin: 18px 0 0; background: #fafdfc; border: 1px solid var(--border); border-radius: 22px; padding: 0 10px 8px; box-shadow: 0 2px 8px rgba(0,50,40,.03); }
    .dept-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 10px 4px 8px; background: linear-gradient(#fafdfc 80%, rgba(250,253,252,0)); border-radius: 22px 22px 0 0; }
    .dept-emoji { width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; font-size: 1.45rem; background: linear-gradient(135deg, var(--primary-light), #fff); border: 1px solid var(--border); box-shadow: 0 3px 8px rgba(0,50,40,.07); flex-shrink: 0; }
    .dept-title b { display: block; font-size: .92rem; font-weight: 800; color: var(--primary); }
    .dept-title small { font-size: .6rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #8a7436; }
    .dept-acts { margin-left: auto; display: none; gap: 4px; }
    body.admin .dept-acts { display: flex; }
    .dept-empty { padding: 10px 6px 12px; font-size: var(--fs-small); color: #6b8f87; }

    /* ===== v5: 4-column grid + animal badges ===== */
    .dept-links { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding: 2px 2px 4px; }
    .dept-links .link-row { margin-bottom: 0; padding: 10px 12px; gap: 10px; min-width: 0; }
    .dept-links .link-row:hover { transform: translateY(-3px); }
    .dept-links .dept-empty { grid-column: 1 / -1; }
    .row-acts button { padding: 3px 6px; }
    @media (max-width: 1150px) { .dept-links { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 820px)  { .dept-links { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 520px)  { .dept-links { grid-template-columns: 1fr; } }
    .app-logo.badge { border: none; box-shadow: inset 0 0 0 2px rgba(229,206,140,.95), inset 0 0 0 3.5px rgba(0,0,0,.30), 0 3px 8px rgba(0,50,40,.18); }
    .app-logo.badge img { width: 25px; height: 25px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.45)); }
    .credit { font-size: .55rem; color: #7c9a93; text-align: right; padding: 4px 6px 0; }
    .credit a { color: inherit; }

    /* ===== v6: wider trending/poll, shiny badges, coloured tile borders, logo picker ===== */
    .stats-row { grid-template-columns: 1fr 1.4fr 1.4fr; }
    .tag-ultra { font-size: .66rem; padding: 3px 9px; }
    .trending-tags { max-height: 54px; gap: 4px; }
    .poll-options { gap: 12px; flex-wrap: nowrap; }
    .poll-option { flex: 1; min-width: 0; }
    .poll-option .poll-vote-btn { width: 100%; font-size: .68rem; padding: 4px 10px; display: flex; justify-content: space-between; }
    .poll-bar { height: 4px; border-radius: 4px; background: #e0ede9; margin-top: 3px; overflow: hidden; }
    .poll-bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--primary), #17a08a); transition: width .5s; }

    .dept-links .link-row { border: 1.5px solid var(--tc, var(--border)); background: linear-gradient(180deg, #fff, color-mix(in srgb, var(--tc, #fff) 5%, #fff)); }
    .dept-links .link-row::before { background: var(--tc, var(--primary)); }
    .dept-links .link-row:hover { box-shadow: 0 10px 22px color-mix(in srgb, var(--tc, #0f6b5f) 28%, transparent); border-color: var(--tc, var(--primary)); }


    #badgePicker { position: fixed; inset: 0; background: rgba(10,40,35,.45); backdrop-filter: blur(3px); display: none; place-items: center; z-index: 70; }
    #badgePicker.open { display: grid; }
    .bp-card { background: #fff; border-radius: 24px; padding: 18px 20px; width: min(660px, 94vw); max-height: 88vh; overflow: auto; box-shadow: 0 30px 70px rgba(0,40,35,.35); }
    .bp-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--primary); font-size: .85rem; }
    .bp-sub { font-size: .65rem; color: #50776f; margin-top: 2px; }
    .bp-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; margin: 14px 0; }
    .bp-item { background: none; border: 2px solid transparent; border-radius: 18px; padding: 4px; cursor: pointer; display: grid; place-items: center; transition: transform .15s, border-color .15s; }
    .bp-item:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--border); }
    .bp-item.sel { border-color: var(--accent); background: #fbf6e8; }
    .bp-item.taken { opacity: .25; cursor: not-allowed; }
    .bp-foot { display: flex; justify-content: space-between; gap: 8px; }
    @media (max-width: 560px) { .bp-grid { grid-template-columns: repeat(5, 1fr); } }

    /* ===== v7: birthdays, letter badges, solid tile borders ===== */
    .stats-row { grid-template-columns: 1fr 1fr; }
    .bday-card { display: flex; flex-direction: column; gap: 4px; }
    .bday-input { flex: 1; max-width: 360px; background: #fff; border: 1.5px solid var(--border); border-radius: 40px; padding: 4px 12px; font: 500 .68rem 'Inter', sans-serif; outline: none; }
    .bday-input:focus { border-color: var(--accent); }
    .bday-names { display: flex; flex-wrap: wrap; gap: 6px; max-height: 60px; overflow-y: auto; align-items: center; padding: 2px 0; }
    .bday-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 13px; border-radius: 999px; font-size: .8rem; font-weight: 700; color: #6b4a12; background: linear-gradient(135deg, #fff7e0, #fff); border: 1.5px solid #e3cc8a; box-shadow: 0 2px 6px rgba(193,146,58,.15); }
    .bday-empty { font-size: .72rem; color: #6b8f87; }
    .dept-links .link-row { border: 2px solid var(--tc, var(--border)); }
    @supports (color: color-mix(in srgb, red, blue)) { .dept-links .link-row { border-color: color-mix(in srgb, var(--tc, #8fb5ac) 88%, #000); } }
    .app-logo.badge .lt { font-family: 'Cinzel Decorative', 'Georgia', serif; font-weight: 900; font-size: 1.3rem; line-height: 1; background: linear-gradient(180deg, #fff6d6, #e6c978 70%, #c9a24a); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)); }
    .bp-tabs { display: flex; gap: 6px; margin: 12px 0 0; }
    .bp-tab { border: 1.5px solid var(--border); background: #fff; color: var(--primary); border-radius: 999px; padding: 4px 14px; font: 700 .7rem 'Inter', sans-serif; cursor: pointer; }
    .bp-tab.on { background: var(--primary); border-color: var(--primary); color: #fff; }
    .bp-grid.letters { grid-template-columns: repeat(9, 1fr); }
    @media (max-width: 560px) { .bp-grid.letters { grid-template-columns: repeat(6, 1fr); } }

    /* ===== v8: bigger mood emojis, edge-only tag, dept gap ===== */
    .sentiment-btn { font-size: 1.35rem; }
    .sentiment-percent { font-size: .6rem; }
    .sections-vertical { padding-top: 2px; padding-bottom: 12px; }
    .edge-tag { display: inline-flex; align-items: center; gap: 3px; margin-left: 6px; padding: 0 7px; border-radius: 999px; background: #e6f0fb; color: #0b5cad; font-size: .52rem; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; vertical-align: middle; }
    .edge-tag i { color: #0b78d4; }
    .delete-link-btn.edge-on { color: #0b78d4; }

    /* ===== v9: favourites card ===== */
    .fav-card { border-color: #e3cc8a; background: linear-gradient(180deg, #fffdf5, #fafdfc); }
    .fav-card .dept-head { background: linear-gradient(#fffdf5 80%, rgba(255,253,245,0)); }
    .fav-card .dept-emoji { background: linear-gradient(135deg, #fff2c9, #fff); border-color: #e3cc8a; }
    .empty-state { padding: 40px 0; text-align: center; color: #50776f; font-size: var(--fs-body); }

    /* ===== v10: premium colour theme ===== */
    :root {
      --bg: #eef4f2; --ink: #14302b; --primary: #0b5d54; --primary-light: #d8efe9;
      --border: #cfe0db; --accent: #b8934a;
      --shadow-sm: 0 6px 18px rgba(8,50,44,.07);
      --shadow-lg: 0 14px 34px rgba(8,50,44,.11);
    }
    body {
      background:
        radial-gradient(1100px 480px at 8% -12%, rgba(15,118,110,.16), transparent 60%),
        radial-gradient(900px 480px at 100% 0%, rgba(184,147,74,.15), transparent 55%),
        linear-gradient(180deg, #f3f8f6, #e9f0f4);
    }
    /* header */
    .header-row { background: linear-gradient(180deg, #fff, #f5faf8); border: 1px solid var(--border); box-shadow: 0 1px 0 rgba(184,147,74,.55), var(--shadow-sm); }
    .brand h1 { background: linear-gradient(90deg, #083f38, #0f8a7c); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .brand h1 span { color: #b8934a; -webkit-text-fill-color: #b8934a; }
    .hydration-gauge-wrapper { background: linear-gradient(135deg, #e0f2ee, #f6f0df); border: 1px solid #d3e6e0; }
    .gauge-label { color: #0b5d54; }
    /* announcement bar */
    .announce-area { background: linear-gradient(90deg, #072f2a, #0b5d54 55%, #0f766e); border: 1px solid #072f2a; box-shadow: var(--shadow-sm); }
    .scroll-text { color: #f7e7b4; font-weight: 600; letter-spacing: .3px; }
    /* stat cards */
    .stat-card { position: relative; overflow: hidden; background: linear-gradient(180deg, #fff, #f7fbfa); border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
    .stat-card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: linear-gradient(90deg, #0f766e, #2dd4bf); }
    .stat-card.bday-card::before { background: linear-gradient(90deg, #b8934a, #ecd592); }
    .stat-title { color: #3d6a62; }
    .stat-title i { color: var(--accent); }
    .sentiment-btn { transition: transform .15s ease; }
    .sentiment-btn:hover { transform: scale(1.18); }
    .sentiment-percent { color: #0b5d54; }
    .sentiment-bar { border-radius: 4px; background: #e3eeea; }
    .sentiment-bar span { border-radius: 4px; }
    .sentiment-item:nth-child(1) .sentiment-bar span { background: #16a34a; }
    .sentiment-item:nth-child(2) .sentiment-bar span { background: #d99a1a; }
    .sentiment-item:nth-child(3) .sentiment-bar span { background: #3b82f6; }
    .sentiment-item:nth-child(4) .sentiment-bar span { background: #dc2626; }
    /* directory panel */
    .quicklinks-section { background: linear-gradient(180deg, #fff, #fbfdfc); border: 1px solid var(--border); box-shadow: var(--shadow-lg); }
    .quicklinks-header h2 { color: #0b5d54; }
    .quicklinks-header h2 i { color: var(--accent); }
    .link-search { border-color: #cfe0db; background: #f9fcfb; }
    .btn { border-color: #cfe0db; color: #0b5d54; }
    .btn:hover { background: #e4f3ef; border-color: #0f766e; }
    /* department tabs */
    .alpha-btn { background: #fff; border-color: #d3e4df; color: #0b5d54; }
    .alpha-btn[style] { border-color: #d3e4df; }
    @supports (color: color-mix(in srgb, red, blue)) { .alpha-btn[style] { border-color: color-mix(in srgb, var(--dc) 45%, #d3e4df); } }
    .alpha-btn:hover:not(:disabled) { background: #eef7f4; }
    .alpha-btn.on { background: linear-gradient(135deg, #083f38, #0f766e); border-color: transparent; color: #fff; box-shadow: 0 6px 14px rgba(8,63,56,.28); }
    .alpha-btn.on[style] { background: linear-gradient(135deg, var(--dc), var(--dc2)); border-color: transparent; }
    /* department cards */
    .dept-card { --dc: #0f766e; --dc2: #2dd4bf; position: relative; background: linear-gradient(180deg, #fff, #fafcfb); border: 1px solid #d6e5e0; box-shadow: 0 5px 18px rgba(8,50,44,.06); }
    @supports (color: color-mix(in srgb, red, blue)) { .dept-card { border-color: color-mix(in srgb, var(--dc) 22%, #dbe8e4); } }
    .dept-card::before { content: ""; position: absolute; left: 0; top: 18px; bottom: 18px; width: 4px; border-radius: 0 6px 6px 0; background: linear-gradient(var(--dc), var(--dc2)); }
    .dept-card .dept-head { background: linear-gradient(#fff 80%, rgba(255,255,255,0)); }
    .dept-card .dept-emoji { background: linear-gradient(135deg, var(--dc), var(--dc2)); border: none; box-shadow: 0 7px 16px rgba(8,50,44,.2); }
    .dept-title b { color: var(--dc); }
    .dept-title small { color: #8a7a52; }
    .fav-card { --dc: #b8934a; --dc2: #ecd592; background: linear-gradient(180deg, #fffdf6, #fffaf0); border-color: #e7d49b; }
    .fav-card .dept-head { background: linear-gradient(#fffdf6 80%, rgba(255,253,246,0)); }
    .dept-links .link-row { box-shadow: 0 3px 10px rgba(8,50,44,.06); }
    .row-name { color: #0b4f47; }
    /* misc polish */
    .admin-pill { background: linear-gradient(135deg, #b8934a, #ecd592); }
    .toast-premium { background: linear-gradient(135deg, #083f38, #0f766e); box-shadow: 0 10px 24px rgba(8,63,56,.3); }
    .credit { color: #7e9a93; }
    /* app tiles take their department's colour (the logo badge keeps its own) */
    .dept-links .link-row { border: 1.5px solid #d3e3de; background: linear-gradient(180deg, #fff, #f9fcfb); }
    .dept-links .link-row::before { background: linear-gradient(var(--dc), var(--dc2)); }
    @supports (color: color-mix(in srgb, red, blue)) {
      .dept-links .link-row { border-color: color-mix(in srgb, var(--dc) 38%, #d8e6e2); background: linear-gradient(180deg, #fff, color-mix(in srgb, var(--dc) 5%, #fff)); }
      .dept-links .link-row:hover { border-color: var(--dc); box-shadow: 0 10px 22px color-mix(in srgb, var(--dc) 25%, transparent); }
    }
    .sections-vertical::-webkit-scrollbar { width: 8px; }
    .sections-vertical::-webkit-scrollbar-thumb { background: #bcd5ce; border-radius: 8px; }
    .sections-vertical::-webkit-scrollbar-track { background: transparent; }

    /* ===== v12: soft text tabs, horizontal tiles with coloured pipe (no borders), new badge / letter style ===== */

    /* department tabs: low-intensity tint, no icons */
    .alpha-strip { gap: 6px; }
    .alpha-strip .alpha-btn[style] { background: #f1f7f5; border: 1px solid #dbe8e4; color: var(--dc); box-shadow: none; font-weight: 600; }
    @supports (color: color-mix(in srgb, red, blue)) {
      .alpha-strip .alpha-btn[style] { background: color-mix(in srgb, var(--dc) 8%, #fff); border-color: color-mix(in srgb, var(--dc) 20%, #fff); color: color-mix(in srgb, var(--dc) 82%, #000); }
      .alpha-strip .alpha-btn[style]:hover:not(:disabled) { background: color-mix(in srgb, var(--dc) 14%, #fff); transform: none; }
      .alpha-strip .alpha-btn.on[style] { background: color-mix(in srgb, var(--dc) 18%, #fff); border-color: color-mix(in srgb, var(--dc) 55%, #fff); color: color-mix(in srgb, var(--dc) 78%, #000); font-weight: 700; box-shadow: none; }
    }
    .alpha-strip .alpha-btn .cnt { margin-left: 6px; font-weight: 700; opacity: .6; }

    /* app tiles: same horizontal layout as before, NO border; a coloured vertical line (department colour) separates apps */
    .dept-links { gap: 10px 0; padding: 4px 0 8px; }
    .dept-links .link-row,
    .dept-links .link-row:hover {
      border: none; background: transparent; box-shadow: none; border-radius: 16px;
      padding: 15px 22px 15px 18px; gap: 14px; overflow: visible;
    }
    .dept-links .link-row:hover { background: color-mix(in srgb, var(--dc, #0f766e) 6%, transparent); transform: translateY(-2px); }
    .dept-links .link-row::before { display: none; }
    .dept-links .link-row::after {
      content: ""; position: absolute; right: 0; top: 16%; bottom: 16%; width: 2.5px; border-radius: 3px;
      background: linear-gradient(180deg, var(--dc, #0f766e), var(--dc2, #2dd4bf)); opacity: .9;
    }
    .dept-links .link-row.eol::after { display: none; }
    @media (max-width: 520px) {   /* single column: the line moves to the left edge of every tile */
      .dept-links .link-row, .dept-links .link-row:hover { padding-left: 22px; }
      .dept-links .link-row::after, .dept-links .link-row.eol::after { display: block; left: 0; right: auto; }
    }
    .dept-links .app-logo { width: 46px; height: 46px; border-radius: 15px; }
    .dept-links .app-logo img { width: 30px; height: 30px; }
    .dept-links .row-name { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.25; text-overflow: clip; }

    /* NEW badge look for every badge (animals, letters, premium glyphs): gold bezel, enamel face, soft gloss */
    .app-logo.badge {
      --c1: #0e5c52; --c2: #17a08a; position: relative;
      border: 3px solid transparent;
      background: linear-gradient(145deg, var(--c1), var(--c2)) padding-box,
                  conic-gradient(from 200deg, #7a5c22, #f4dd9a, #b8934a, #fff1c4, #8a6a2a, #e2c273, #7a5c22) border-box;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.42), inset 0 7px 9px rgba(255,255,255,.15), inset 0 -7px 9px rgba(0,0,0,.28), 0 5px 12px rgba(6,30,26,.28);
    }
    .app-logo.badge::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(160deg, rgba(255,255,255,.26), rgba(255,255,255,0) 46%); }
    .app-logo.badge img { filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.55)); }
    .app-logo.badge .lt {
      font-family: 'Playfair Display', 'Georgia', serif; font-weight: 900; font-style: italic; font-size: 1.45rem; line-height: 1; letter-spacing: -.5px;
      background: linear-gradient(180deg, #fffbe8, #f0d58a 55%, #c9a24a); -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 1px 1px rgba(0,0,0,.55));
    }
    .app-logo.badge i.fg {
      font-size: 1.25rem; line-height: 1;
      background: linear-gradient(180deg, #fffbe8, #f0d58a 55%, #c9a24a); -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 1px 1.2px rgba(0,0,0,.6));
    }
    .dept-links .app-logo.badge i.fg { font-size: 1.4rem; }
    .app-logo.badge.prem { box-shadow: inset 0 0 0 1px rgba(0,0,0,.42), inset 0 7px 9px rgba(255,255,255,.18), inset 0 -7px 9px rgba(0,0,0,.32), 0 0 0 1.5px rgba(184,147,74,.5), 0 6px 14px rgba(20,20,40,.3); }

    /* ===== v13: matt black badges, white icons (animals, letters, premium emblems) ===== */
    .app-logo.badge, .app-logo.badge.prem {
      background: #121212; border: 2px solid #2b2b2b;
      box-shadow: 0 4px 10px rgba(0,0,0,.25);
    }
    .app-logo.badge::after { display: none; }
    .app-logo.badge img { filter: none; }
    .app-logo.badge .lt, .app-logo.badge i.fg {
      background: none; -webkit-background-clip: border-box; background-clip: border-box;
      color: #fff; -webkit-text-fill-color: #fff; filter: none;
    }

    /* ===== v14: badge face = the app's own department colour (matt, flat), white icon ===== */
    .app-logo.badge, .app-logo.badge.prem {
      background: var(--dc, #0f766e);
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--dc, #0f766e) 60%, #000), 0 4px 10px color-mix(in srgb, var(--dc, #0f766e) 35%, transparent);
    }

    /* ===== v15: department colour picker, premium icon groups ===== */
    .bp-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
    .bp-chip { border: 1px solid var(--border); background: #fff; color: var(--primary); border-radius: 999px; padding: 3px 12px; font: 600 .66rem 'Inter', sans-serif; cursor: pointer; }
    .bp-chip.on { background: color-mix(in srgb, var(--dc, #0f766e) 16%, #fff); border-color: var(--dc, #0f766e); color: color-mix(in srgb, var(--dc, #0f766e) 80%, #000); }
    .cp-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin: 16px 0 12px; }
    .cp-sw { aspect-ratio: 1; border-radius: 14px; border: 3px solid #fff; box-shadow: 0 0 0 1px #cfe0db; cursor: pointer; transition: transform .15s; }
    .cp-sw:hover { transform: scale(1.08); }
    .cp-sw.sel { box-shadow: 0 0 0 3px #14302b; }
    .cp-row { display: flex; align-items: center; gap: 10px; font-size: .72rem; color: #50776f; }
    .cp-row input[type=color] { width: 44px; height: 34px; border: 1px solid var(--border); border-radius: 10px; padding: 2px; background: #fff; cursor: pointer; }

    /* ===== v16: app title always one line, trimmed with "..." ===== */
    .dept-links .row-name { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; -webkit-line-clamp: unset; -webkit-box-orient: initial; }
    .dept-links .row-main { min-width: 0; }

    /* ===== v17: announcement slides across the whole bar, from the right corner to the left corner ===== */
    .announce-area .scroller { position: relative; height: 22px; overflow: hidden; }
    .announce-area .scroll-text {
      position: absolute; top: 0; left: 100%; line-height: 22px; white-space: nowrap;
      animation: slideAcross 18s linear infinite;
    }
    @keyframes slideAcross { 0% { left: 100%; transform: translateX(0); } 100% { left: 0; transform: translateX(-100%); } }

    /* ===== v18: move app to another department ===== */
    .mv-list { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 4px; }
    .mv-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; border: 1px solid color-mix(in srgb, var(--dc) 25%, #fff); border-radius: 14px; background: color-mix(in srgb, var(--dc) 7%, #fff); color: color-mix(in srgb, var(--dc) 80%, #000); font: 700 .8rem 'Inter', sans-serif; cursor: pointer; text-align: left; }
    .mv-item:hover { background: color-mix(in srgb, var(--dc) 15%, #fff); }
    .mv-item small { margin-left: auto; font-weight: 600; opacity: .65; font-size: .65rem; }
    .mv-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--dc); flex-shrink: 0; }
  </style>
</head>
<body>
  <div id="loading"><div class="loader"></div></div>
  <div id="drinkToast" class="toast-premium toast-hidden"><i class="fas fa-tint"></i><span>Hydration · drink water</span></div>

  <div class="dashboard">
    <!-- header -->
    <header class="header-row">
      <div class="brand">
        <div class="logo" id="logoBtn"><img id="logoImg" src="https://www.circulatecapital.com/wp-content/uploads/2022/10/Srichakra.png" alt="Srichakra"></div>
        <h1>SRICHAKRA <span>APP HUB</span></h1>
      </div>
      <div class="hydration-gauge-wrapper">
        <span class="gauge-label"><i class="fas fa-tint"></i> hydrate yourself in:</span>
        <div class="liquid-gauge">
          <canvas id="hydrationGauge" width="40" height="40"></canvas>
          <span class="timer-overlay" id="hydrationTimer">45:00</span>
        </div>
      </div>
      <div class="admin-bar admin-only">
        <span class="admin-pill">ADMIN</span>
        <span class="admin-status" id="adminStatus">auto-saving</span>
        <button id="exitAdminBtn" class="btn btn-small"><i class="fas fa-sign-out-alt"></i> exit</button>
      </div>
    </header>

    <!-- announcement -->
    <div class="announce-area">
      <div class="scroller"><span class="scroll-text" id="announcementText">♻️ Welcome to the Srichakra App Hub</span></div>
      <div class="news-admin admin-only">
        <input type="text" id="newsInput" placeholder="announcement">
        <button id="updateNewsBtn" class="btn btn-small"><i class="fas fa-check"></i> update</button>
      </div>
    </div>

    <!-- stats row: sentiment + trending + poll -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-title"><i class="far fa-smile"></i> How is your mood today</div>
        <div class="sentiment-row" id="sentimentRow"></div>
        <div style="font-size:0.5rem; color:#50776f;"><i class="fas fa-info-circle"></i> 1/day</div>
      </div>
      <div class="stat-card bday-card">
        <div class="stat-title" style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
          <span><i class="fas fa-birthday-cake"></i> birthdays today</span>
          <span class="admin-only" style="display:flex; gap:4px; flex:1; justify-content:flex-end;">
            <input type="text" id="bdayInput" class="bday-input" placeholder="Names, comma separated">
            <button id="bdayBtn" class="btn btn-small"><i class="fas fa-check"></i> set</button>
          </span>
        </div>
        <div class="bday-names" id="bdayNames"></div>
      </div>
    </div>

    <!-- QUICK LINKS – vertical sections, each with horizontal scroll of emoji links -->
    <div class="quicklinks-section">
      <div class="quicklinks-header">
        <h2><i class="fas fa-th-large"></i> App directory · by department</h2>
        <span style="display:flex; gap:6px; align-items:center;">
          <input id="linkSearch" class="link-search" type="text" placeholder="search apps…" autocomplete="off">
          <button id="addDeptBtn" class="btn admin-only"><i class="fas fa-plus-circle"></i> new department</button>
        </span>
      </div>
      <div id="deptStrip" class="alpha-strip"></div>
      <div id="sectionsVertical" class="sections-vertical"></div>
      <div class="credit">Badge icons by Lorc &amp; Delapouite · <a href="https://game-icons.net" target="_blank" rel="noopener">game-icons.net</a> · CC BY 3.0</div>
    </div>
  </div>

  <div id="badgePicker"></div>

  <script>
    (function(){
      "use strict";
      document.addEventListener('contextmenu', e => e.preventDefault());   // no right-click menu anywhere on the page
      const HYDRATION_MINUTES = 45;
      const TOTAL_HYDRATION_MS = HYDRATION_MINUTES * 60 * 1000;
      const KEYS = { HYDRATION_TARGET: 'hydrationTarget' };
      const LOGO_FALLBACKS = ['https://srichakra.in/wp-content/uploads/2024/03/Srichakra-00-Clear.png', 'https://placehold.co/140x34/0f6b5f/ffffff?text=SRICHAKRA'];
      const $ = id => document.getElementById(id);
      const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const toast = $('drinkToast');
      function showToastMsg(msg){ toast.innerHTML = `<i class="fas fa-tint"></i><span>${esc(msg)}</span>`; toast.classList.remove('toast-hidden'); setTimeout(() => toast.classList.add('toast-hidden'), 2500); }

      // gauge
      const gaugeCanvas = document.getElementById('hydrationGauge');
      const gctx = gaugeCanvas.getContext('2d');
      let waveOffset = 0;
      function drawLiquidGauge(percent){
        const w=40,h=40; const cx=20,cy=20,r=18;
        gctx.clearRect(0,0,w,h);
        gctx.beginPath(); gctx.arc(cx,cy,r,0,2*Math.PI);
        gctx.strokeStyle = '#b9d9d2'; gctx.lineWidth = 1.5; gctx.stroke();
        gctx.fillStyle = '#f0fcf9'; gctx.fill();
        gctx.save(); gctx.beginPath(); gctx.arc(cx,cy,r-1,0,2*Math.PI); gctx.clip();
        const waterLevel = cy + (r*2)*(1-percent)-r;
        const waveH=2.5, freq=0.07;
        gctx.fillStyle = 'rgba(80,190,180,0.35)';
        gctx.beginPath(); gctx.moveTo(0, waterLevel);
        for(let x=0; x<=w; x+=6){ gctx.lineTo(x, waterLevel + Math.sin(x*freq+waveOffset)*waveH); }
        gctx.lineTo(w,h); gctx.lineTo(0,h); gctx.closePath(); gctx.fill();
        gctx.fillStyle = 'rgba(100,210,190,0.25)';
        gctx.beginPath(); gctx.moveTo(0, waterLevel-2);
        for(let x=0; x<=w; x+=6){ gctx.lineTo(x, waterLevel-2 + Math.sin(x*freq+waveOffset+2)*(waveH-1)); }
        gctx.lineTo(w,h); gctx.lineTo(0,h); gctx.closePath(); gctx.fill();
        gctx.restore();
        waveOffset += 0.15;

      function usage(){ try{ return JSON.parse(localStorage.getItem('appUsage')) || {}; }catch(e){ return {}; } }
      function countUse(id){
        const u = usage(), r = u[id] || { n: 0, t: 0 }; r.n++; r.t = Date.now(); u[id] = r;
        try{ localStorage.setItem('appUsage', JSON.stringify(u)); }catch(e){}
      }
      function favorites(){
        const u = usage(), all = [];
        D.departments.forEach(d => d.links.forEach(l => { const r = u[l.id]; if(r && r.n >= FAV_MIN) all.push({ l, n: r.n, t: r.t }); }));
        return all.sort((a,b) => b.n - a.n || b.t - a.t).slice(0, FAV_MAX).map(x => x.l);
      }
      const sortedDepts = () => D.departments.slice().sort((a,b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));

      function renderDeptStrip(){
        if(dept !== 'ALL' && dept !== 'FAV' && !D.departments.some(x => x.id === dept)) dept = 'ALL';
        let html = `<button class="alpha-btn ${dept==='FAV'?'on':''}" style="--dc:#b8934a;--dc2:#e3c677" data-d="FAV">Favorites<span class="cnt">${favorites().length}</span></button>`;
        sortedDepts().forEach(x => { html += `<button class="alpha-btn ${dept===x.id?'on':''}" style="${deptStyle(x.id)}" data-d="${esc(x.id)}">${esc(x.name)}<span class="cnt">${x.links.length}</span></button>`; });
        const strip = $('deptStrip'); strip.innerHTML = html;
        strip.querySelectorAll('.alpha-btn').forEach(b => b.addEventListener('click', () => { dept = (dept === b.dataset.d) ? 'ALL' : b.dataset.d; renderLinks(); $('sectionsVertical').scrollTop = 0; }));
      }

      function rowHtml(l, depId, n, acts){
        return `<a class="link-row" style="animation-delay:${Math.min(n,16)*40}ms; --tc:${tileColor(l.badge)}; ${deptStyle(depId || ((D.departments.find(d => d.links.includes(l)) || {}).id))}" href="/go/${esc(l.id)}" target="_blank" rel="noopener" data-edge="${l.edgeOnly ? 1 : 0}" data-id="${esc(l.id)}">
            <span class="app-logo" data-name="${esc(l.name)}" data-id="${esc(l.id)}" data-badge="${esc(l.badge || '')}" data-usebadge="${l.useBadge ? 1 : 0}"></span>
            <span class="row-main"><span class="row-name">${esc(l.name)}</span><span class="row-host">${l.edgeOnly ? '<span class="edge-tag"><i class="fab fa-edge"></i> Edge only</span>' : ''}</span></span>
            ${acts ? `<span class="row-acts">
              <button class="delete-link-btn" data-act="logo" data-d="${esc(depId)}" data-id="${esc(l.id)}" title="choose logo"><i class="fas fa-paw"></i></button>
              <button class="delete-link-btn ${l.edgeOnly ? 'edge-on' : ''}" data-act="edge" data-d="${esc(depId)}" data-id="${esc(l.id)}" title="${l.edgeOnly ? 'Edge only: click to allow any browser' : 'mark as Edge-only'}"><i class="fab fa-edge"></i></button>
              <button class="delete-link-btn" data-act="move" data-d="${esc(depId)}" data-id="${esc(l.id)}" title="move to another department"><i class="fas fa-folder-open"></i></button>
              <button class="delete-link-btn" data-act="edit" data-d="${esc(depId)}" data-id="${esc(l.id)}" title="edit"><i class="fas fa-pen"></i></button>
              <button class="delete-link-btn" data-act="del" data-d="${esc(depId)}" data-id="${esc(l.id)}" title="delete"><i class="fas fa-times-circle"></i></button>
            </span>` : ''}
            <i class="fas fa-arrow-right row-go"></i>
          </a>`;
      }

      // the coloured pipe sits between apps, so the last app of each row has none
      function markRowEnds(root){
        (root || document).querySelectorAll('.dept-links').forEach(g => {
          const t = Array.from(g.querySelectorAll('.link-row'));
          t.forEach((a, i) => a.classList.toggle('eol', !t[i + 1] || t[i + 1].offsetTop !== a.offsetTop));
        });
      }
      window.addEventListener('resize', () => markRowEnds($('sectionsVertical')));
      function renderLinks(){
        ensureBadges();
        renderDeptStrip();
        const q = query.trim().toLowerCase(), box = $('sectionsVertical');
        let n = 0, html = '';
        const favs = favorites().filter(l => !q || l.name.toLowerCase().includes(q));
        if(dept === 'FAV' || (dept === 'ALL' && favs.length)){
          html += `<section class="dept-card fav-card"><div class="dept-head"><span class="dept-emoji">⭐</span>
              <div class="dept-title"><b>Favorites</b><small>${favs.length ? 'Your most used apps' : 'Nothing here yet'}</small></div></div>
              <div class="dept-links">${favs.length ? favs.map(l => rowHtml(l, '', n++, false)).join('') : '<div class="dept-empty">Apps you open often will appear here automatically.</div>'}</div></section>`;
        }
        if(dept !== 'FAV') sortedDepts().filter(x => dept === 'ALL' || x.id === dept).forEach(x => {
          const list = x.links.filter(l => !q || l.name.toLowerCase().includes(q));
          if(q && !list.length && !admin) return;
          html += `<section class="dept-card" style="${deptStyle(x.id)}"><div class="dept-head"><span class="dept-emoji">${esc(x.emoji)}</span>
              <div class="dept-title"><b>${esc(x.name)}</b><small>${plural(x.links.length)}</small></div>
              <span class="dept-acts">
                <button class="btn btn-small" data-act="addapp" data-d="${esc(x.id)}"><i class="fas fa-plus"></i> add app</button>
                <button class="btn btn-small ${D.defaultDept === x.id ? 'btn-gold' : ''}" data-act="defaultdept" data-d="${esc(x.id)}" title="the tab that is open when the page loads">${D.defaultDept === x.id ? 'default tab ✓' : 'set as default'}</button>
                <button class="btn btn-small" data-act="colordept" data-d="${esc(x.id)}" title="department colour"><i class="fas fa-palette"></i> colour</button>
                <button class="btn btn-small" data-act="editdept" data-d="${esc(x.id)}"><i class="fas fa-pen"></i></button>
                <button class="btn btn-small" data-act="deldept" data-d="${esc(x.id)}"><i class="fas fa-trash-alt"></i></button>
              </span></div><div class="dept-links">`;
          if(!list.length) html += `<div class="dept-empty">${x.links.length ? 'No matching apps.' : 'No apps yet.'}</div>`;
          list.forEach(l => { html += rowHtml(l, x.id, n++, true); });
          html += '</div></section>';
        });
        box.innerHTML = html || '<div class="empty-state">' + (D.departments.length ? 'No matching apps.' : 'No departments yet.') + '</div>';
        hydrateLogos(box); markRowEnds(box);
        box.querySelectorAll('[data-act]').forEach(btn => btn.addEventListener('click', e => {
          e.preventDefault(); e.stopPropagation();
          const dep = D.departments.find(x => x.id === btn.dataset.d); if(!dep) return;
          const act = btn.dataset.act, link = dep.links.find(x => x.id === btn.dataset.id);
          if(act === 'addapp'){ const l = askLink(); if(l){ dep.links.push(Object.assign({ id:'n' + Date.now().toString(36), name:l.name, url:l.url }, l.edge ? { edgeOnly:true } : {})); ensureBadges(); renderLinks(); saveAdmin({ op:'link_add', dept:dep.id, link:dep.links[dep.links.length-1] }); } }
          else if(act === 'logo' && link){ openPicker(link, dep.id); }
          else if(act === 'move' && link){ openMovePicker(link, dep); }
          else if(act === 'edge' && link){ link.edgeOnly = !link.edgeOnly; renderLinks(); saveAdmin({ op:'link_update', dept:dep.id, id:link.id, fields:{ edgeOnly:link.edgeOnly } }); }
          else if(act === 'edit' && link){ const u = askLink(link); if(u){ link.name = u.name; link.url = u.url; renderLinks(); saveAdmin({ op:'link_update', dept:dep.id, id:link.id, fields:{ name:link.name, url:link.url } }); } }
          else if(act === 'del' && link){ if(confirm('Delete "' + link.name + '"?')){ dep.links = dep.links.filter(x => x !== link); renderLinks(); saveAdmin({ op:'link_delete', dept:dep.id, id:link.id }); } }
          else if(act === 'editdept'){ const r = askDept(dep); if(r){ dep.name = r.name; dep.emoji = r.emoji; renderLinks(); saveAdmin({ op:'dept_update', dept:dep.id, name:dep.name, emoji:dep.emoji }); } }
          else if(act === 'colordept'){ openColorPicker(dep); }
          else if(act === 'defaultdept'){ D.defaultDept = (D.defaultDept === dep.id) ? '' : dep.id; renderLinks(); saveAdmin({ op:'default_dept', dept:D.defaultDept }); }
          else if(act === 'deldept'){ if(confirm('Delete department "' + dep.name + '"' + (dep.links.length ? ' and its ' + plural(dep.links.length) : '') + '?')){ D.departments = D.departments.filter(x => x !== dep); renderLinks(); saveAdmin({ op:'dept_delete', dept:dep.id }); } }
        }));
      }
      // count every app opening (normal click or middle-click) for the Favorites tab
      const countClick = e => { const a = e.target.closest('a.link-row'); if(!a || e.target.closest('[data-act]')) return; countUse(a.dataset.id); setTimeout(renderLinks, 250); };   // redraw after the click so the Favorites card updates at once
      $('sectionsVertical').addEventListener('click', countClick);
      $('sectionsVertical').addEventListener('auxclick', e => { if(e.button === 1) countClick(e); });
      function askLink(base){
        const name = prompt('App name:', base ? base.name : ''); if(!name || !name.trim()) return null;
        let url = (prompt('App URL (full link):', base ? base.url : 'https://') || '').trim(); if(!url) return null;
        if(!/^https?:\/\//i.test(url)) url = 'https://' + url;
        const edge = base ? false : confirm('Does this app work only in Microsoft Edge?\n\nOK = Edge only\nCancel = any browser');
        return { name: name.trim(), url, edge };
      }
      function askDept(base){
        const name = prompt('Department name:', base ? base.name : ''); if(!name || !name.trim()) return null;
        const emoji = (prompt('Emoji for this department (e.g. 👥 💻 💰 📡 ⚙️):', base ? base.emoji : '📁') || '📁').trim();
        return { name: name.trim(), emoji };
      }
      $('addDeptBtn').addEventListener('click', () => {
        const r = askDept(); if(!r) return;
        D.departments.push({ id:'d' + Date.now().toString(36), name:r.name, emoji:r.emoji, links:[] }); dept = 'ALL'; renderLinks(); saveAdmin({ op:'dept_add', dept:D.departments[D.departments.length-1] });
      });
      $('linkSearch').addEventListener('input', e => { query = e.target.value; renderLinks(); });

      // ---------- hidden admin: click the logo 7 times ----------
      let clicks = 0, clickTimer;
      async function enterAdmin(){
        try{ D = await api('/api/admin/data'); admin = true; document.body.classList.add('admin'); renderAll(); showToastMsg('Admin mode on · changes save automatically'); }
        catch(e){ sessionStorage.removeItem('adminPin'); }
      }
      $('logoBtn').addEventListener('click', () => {
        clicks++; clearTimeout(clickTimer); clickTimer = setTimeout(() => clicks = 0, 2500);
        if(clicks >= 7){ clicks = 0; if(!admin) enterAdmin(); }
      });
      $('exitAdminBtn').addEventListener('click', () => { admin = false; document.body.classList.remove('admin'); refresh(); });

      function renderAll(){ renderLogo(); renderAnnouncement(); renderMood(); renderBirthdays(); renderLinks(); }

      // ---------- bootstrap ----------
      document.addEventListener('DOMContentLoaded', () => {
        const loadingEl = $('loading');
        setTimeout(() => { loadingEl.style.opacity='0'; setTimeout(() => loadingEl.style.display='none', 300); }, 50);
        drawLiquidGauge(1); initTimer(); renderAll(); refresh();
        setInterval(() => { if(!document.hidden) refresh(); }, 30000);   // everyone sees new links / votes within 30s
      });
      window.addEventListener('load', () => { const l=$('loading'); l.style.opacity='0'; setTimeout(() => l.style.display='none', 300); });
      setTimeout(() => { const l=$('loading'); if(l && l.style.display!=='none'){ l.style.opacity='0'; setTimeout(() => l.style.display='none', 300); } }, 1500);
    })();
  </script>
  <style>
    .modal.hidden { display: none; }
    .toast-hidden { display: none; }
  </style>

  <!-- Responsive layout improvements: phones, tablets, laptops, and 1920×1080 desktops -->
  <style id="responsive-layout">
    /* Fluid sizing and viewport-safe height */
    html { min-height: 100%; }
    body {
      min-width: 320px;
      min-height: 100dvh;
      height: auto;
      overflow-x: hidden;
      overflow-y: auto;
      padding: clamp(6px, 0.7vw, 16px);
    }
    .dashboard {
      width: 100%;
      max-width: 1880px;
      min-height: calc(100dvh - 2 * clamp(6px, 0.7vw, 16px));
      height: auto;
      overflow: visible;
      gap: clamp(6px, 0.55vw, 12px);
    }
    .header-row {
      flex-wrap: wrap;
      gap: 10px 18px;
      border-radius: clamp(18px, 2vw, 40px);
      min-width: 0;
    }
    .brand { min-width: 0; }
    .brand h1 { white-space: normal; }
    .hydration-gauge-wrapper { max-width: 100%; }
    .announce-area { min-width: 0; gap: 8px; }
    .news-admin { display: flex; align-items: center; gap: 6px; }
    .stats-row { min-width: 0; }
    .stat-card { min-width: 0; }
    .quicklinks-section { min-width: 0; }
    .quicklinks-header { flex-wrap: wrap; gap: 8px; }
    .quicklinks-header > span { flex-wrap: wrap; min-width: 0; }
    .link-search { max-width: 100%; }
    .dept-links { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .dept-links .link-row { min-width: 0; }
    .row-main { min-width: 0; }
    .row-name { overflow-wrap: anywhere; }
    .dept-title { min-width: 0; }
    .dept-title b { overflow-wrap: anywhere; }
    .dept-acts { flex-wrap: wrap; }
    .credit { overflow-wrap: anywhere; }

    /* Wide desktop, including 1920×1080 */
    @media (min-width: 1600px) and (min-height: 850px) {
      body { overflow: hidden; }
      .dashboard {
        height: calc(100dvh - 2 * clamp(6px, 0.7vw, 16px));
        min-height: 0;
        max-width: 1880px;
        overflow: hidden;
      }
      .header-row { flex-wrap: nowrap; padding: 8px 22px; }
      .brand h1 { font-size: clamp(.95rem, 1vw, 1.35rem); }
      .announce-area { flex: 0 0 auto; min-height: 38px; }
      .stats-row { grid-template-columns: minmax(220px, .8fr) minmax(320px, 1.2fr); }
      .quicklinks-section { flex: 1 1 0; min-height: 0; }
      .sections-vertical { min-height: 0; overflow-y: auto; }
      .dept-links { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    /* Standard laptops and smaller desktop monitors */
    @media (min-width: 1100px) and (max-width: 1599px) {
      body { overflow-y: auto; }
      .dashboard { max-width: 1500px; }
      .stats-row { grid-template-columns: minmax(220px, .8fr) minmax(300px, 1.2fr); }
      .dept-links { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    /* Tablets / compact laptop windows */
    @media (max-width: 1099px) {
      .dashboard { max-width: 100%; }
      .header-row { justify-content: flex-start; }
      .brand { flex: 1 1 280px; }
      .hydration-gauge-wrapper { flex: 0 1 auto; }
      .stats-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .dept-links { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .quicklinks-section { min-height: 55vh; }
      .sections-vertical { overflow: visible; }
    }

    /* Mobile phones */
    @media (max-width: 640px) {
      body { padding: 6px; }
      .dashboard { gap: 8px; }
      .header-row {
        border-radius: 18px;
        padding: 10px;
        align-items: flex-start;
      }
      .brand { flex: 1 1 100%; gap: 8px; }
      .logo img { height: 28px; max-width: 100px; object-fit: contain; }
      .brand h1 { font-size: clamp(.72rem, 3.5vw, .95rem); letter-spacing: 1px; }
      .hydration-gauge-wrapper { padding: 5px 8px; gap: 6px; }
      .gauge-label { font-size: .58rem; }
      .liquid-gauge, #hydrationGauge { width: 34px; height: 34px; }
      .timer-overlay { font-size: .48rem; }
      .admin-bar { flex-wrap: wrap; }
      .announce-area { border-radius: 14px; padding: 8px 10px; }
      .scroll-text { font-size: .68rem; }
      .news-admin input { width: min(42vw, 130px); }
      .stats-row { grid-template-columns: minmax(0, 1fr); gap: 8px; }
      .stat-card { border-radius: 14px; padding: 10px; }
      .stat-title { font-size: .68rem; }
      .bday-card .stat-title { flex-wrap: wrap; }
      .bday-input { min-width: 0; width: 100%; }
      .quicklinks-section { padding: 10px; border-radius: 16px; min-height: 0; }
      .quicklinks-header h2 { font-size: .78rem; }
      .quicklinks-header > span { width: 100%; }
      .link-search { width: 100%; flex: 1 1 100%; }
      .quicklinks-header .btn { white-space: normal; }
      .alpha-strip { max-width: 100%; }
      .dept-links { grid-template-columns: minmax(0, 1fr); gap: 7px; }
      .dept-card { margin-top: 10px; padding: 0 8px 8px; border-radius: 16px; }
      .dept-head { flex-wrap: wrap; gap: 8px; padding: 9px 2px; }
      .dept-emoji { width: 38px; height: 38px; font-size: 1.15rem; }
      .dept-title { flex: 1 1 150px; }
      .dept-title b { font-size: .82rem; }
      .dept-acts { width: 100%; margin-left: 0; }
      .dept-links .link-row { padding: 9px; gap: 8px; border-radius: 14px; }
      .app-logo { width: 36px; height: 36px; }
      .row-name { white-space: normal; overflow-wrap: anywhere; font-size: .78rem; }
      .row-host { white-space: normal; overflow-wrap: anywhere; }
      .row-go { flex-shrink: 0; }
      .row-acts { flex-wrap: wrap; }
      .credit { font-size: .52rem; text-align: left; }
      .modal-content { max-height: 90dvh; overflow-y: auto; padding: 18px; border-radius: 22px; }
      .bp-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
      .toast-premium { left: 10px; right: 10px; bottom: 10px; justify-content: center; text-align: center; }
    }

    /* Very narrow phones */
    @media (max-width: 380px) {
      .brand h1 { font-size: .68rem; letter-spacing: .5px; }
      .gauge-label { max-width: 105px; }
      .sentiment-btn { font-size: 1.1rem; }
      .dept-links .link-row { gap: 6px; padding: 8px; }
      .app-logo { width: 32px; height: 32px; }
      .row-name { font-size: .72rem; }
    }

    /* Landscape phones: use available width without forcing desktop overflow */
    @media (max-width: 900px) and (orientation: landscape) {
      .header-row { align-items: center; }
      .brand { flex: 1 1 220px; }
      .stats-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .dept-links { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    /* Respect reduced-motion preferences */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>

</body>
